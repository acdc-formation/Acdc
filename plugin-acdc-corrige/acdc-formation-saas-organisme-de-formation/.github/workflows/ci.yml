name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  quality:
    name: Lint · PHPCS · PHPStan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -not -path './assets/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP_CodeSniffer (WPCS)
        run: composer phpcs || true   # informatif tant que la dette n'est pas résorbée

      - name: PHPStan (analyse statique)
        run: composer phpstan || true # informatif : monter le niveau progressivement

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tests
        run: composer test || true   # activer (retirer '|| true') une fois la suite en place
