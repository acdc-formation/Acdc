name: CI — ACDC plugin

on:
  push:
    branches: [ "**" ]
  pull_request:

defaults:
  run:
    working-directory: plugin-acdc-corrige/acdc-formation-saas-organisme-de-formation

jobs:
  lint:
    name: PHP lint (matrice)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPUnit
        run: composer test
      - name: PHPCS (informatif)
        run: composer phpcs || true
      - name: PHPStan (informatif)
        run: composer phpstan || true
